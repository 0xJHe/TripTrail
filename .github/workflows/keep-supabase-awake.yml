# Keeps the Supabase project awake: the free plan pauses a project after about a week
# without activity. Every 2 days this asks the database for one row of `trips` (read only,
# anon key, so RLS answers with an empty list) and fails if Supabase doesn't answer.
# Needs the repository secrets SUPABASE_URL and SUPABASE_ANON_KEY.

name: Keep Supabase awake

on:
  schedule:
    - cron: '0 3 */2 * *' # 03:00 UTC (11:00 Malaysia time) every 2nd day of the month
  workflow_dispatch: # "Run workflow" button, to test it by hand

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the database for one row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets first."
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/trips?select=id&limit=1") || status=000
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer (HTTP $status). Check the project in the Supabase dashboard."
            head -c 300 response.json 2>/dev/null || true
            exit 1
          fi
          echo "The database answered. It stays awake."
